# Render.com Blueprint — static site (no server, no running costs).
# Render dashboard → New → Blueprint → select this repository. Or create a "Static Site" manually with the same settings.
services:
  - type: web
    runtime: static
    name: dovero-group
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      # English is the default language
      - type: redirect
        source: /
        destination: /en/
      - type: redirect
        source: /index.html
        destination: /en/
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      # Hashed build assets never change → cache for a year
      - path: /_astro/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /media/*
        name: Cache-Control
        value: public, max-age=2592000
